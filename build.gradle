plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.3'
}

group = 'net.sixik.steamaudio'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def nativesResourceDir = file('src/main/resources/net/sixik/steamaudio/natives/windows-x64')

tasks.register('configureNatives', Exec) {
    description = 'Configures the CMake build of the JNI natives'
    commandLine 'cmake', '-S', 'natives', '-B', 'natives/build'
}

tasks.register('buildNatives', Exec) {
    description = 'Builds the JNI natives via CMake (Release)'
    dependsOn 'configureNatives'
    commandLine 'cmake', '--build', 'natives/build', '--config', 'Release'
}

tasks.register('copyNatives', Copy) {
    description = 'Copies built natives into the jar resources'
    dependsOn 'buildNatives'
    from('natives/build/bin/Release') {
        // TrueAudioNext.dll/GPUUtilities.dll нужны только для GPU-фич;
        // phonon.dll работает без них.
        include 'SteamAudioJni.dll', 'phonon.dll'
    }
    into nativesResourceDir
}

processResources {
    dependsOn 'copyNatives'
}

jmh {
    jmhVersion = '1.37'
    warmupIterations = 5
    iterations = 5
    fork = 1
    profilers = ['gc']
    resultFormat = 'CSV'
    resultsFile = file('build/reports/jmh/results.csv')
}