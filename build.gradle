plugins {
    id 'java'
    id 'me.champeau.jmh' version '0.7.3'
}

group = 'net.sixik.steamaudio'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
// MSVC (multi-config) кладет DLL в bin/Release; Linux single-config — в bin.
def nativesBuildBin = isWindows ? 'natives/build/bin/Release' : 'natives/build/bin'
def nativeArtifacts = isWindows
        ? ['SteamAudioJni.dll', 'phonon.dll']
        : ['libSteamAudioJni.so', 'libphonon.so']
def nativesPlatform = isWindows ? 'windows-x64' : 'linux-x64'
def nativesResourceDir = file("src/main/resources/net/sixik/steamaudio/natives/${nativesPlatform}")

tasks.register('configureNatives', Exec) {
    description = 'Configures the CMake build of the JNI natives'
    if (isWindows) {
        commandLine 'cmake', '-S', 'natives', '-B', 'natives/build'
    } else {
        commandLine 'cmake', '-S', 'natives', '-B', 'natives/build', '-DCMAKE_BUILD_TYPE=Release'
    }
}

tasks.register('buildNatives', Exec) {
    description = 'Builds the JNI natives via CMake'
    dependsOn 'configureNatives'
    if (isWindows) {
        commandLine 'cmake', '--build', 'natives/build', '--config', 'Release'
    } else {
        commandLine 'cmake', '--build', 'natives/build'
    }
}

tasks.register('copyNatives', Copy) {
    description = "Copies built natives (${nativesPlatform}) into the jar resources"
    dependsOn 'buildNatives'
    from(nativesBuildBin) {
        include nativeArtifacts
    }
    into nativesResourceDir
}

processResources {
    dependsOn 'copyNatives'
}

jmh {
    jmhVersion = '1.37'
    warmupIterations = 5
    iterations = 5
    fork = 1
    profilers = ['gc']
    resultFormat = 'CSV'
    resultsFile = file('build/reports/jmh/results.csv')
}